<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! Thank you my loveee! ❤️</title>
    <!-- Google Fonts for cute typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-forgiven">
    <!-- Animated background containers -->
    <div class="hearts-container" id="hearts-container"></div>
    <div class="confetti-container" id="confetti-container"></div>
    <div class="sparkles-container" id="sparkles-container"></div>

    <div class="container">
        <div class="card celebration-card">
            <h1 class="celebration-title">Yay! Thank you my loveee! ❤️</h1>
            
            <div class="sticker-container dancing-container">
                <img src="assets/happy_bear.png" alt="Happy dancing bear sticker" class="sticker happy-bear-sticker">
            </div>

            <p class="celebration-text">You make my heart melt! I promise to make it up to you! 🥰</p>
            
            <!-- Simple replay button just in case they want to experience it again -->
            <div class="button-container">
                <button class="btn btn-replay" onclick="window.location.href='index.html'">Aww, play again!</button>
            </div>
        </div>
    </div>

    <!-- We will use the same script.js which will detect if it's on forgiven.html and trigger confetti -->
    <script src="js/script.js"></script>
</body>
</html>
